<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Siper ile web sitenizin HTTPS, TLS ve güvenlik başlıklarını pasif olarak ölçün.">
  <title>Siper — Web Güvenlik Puanı</title>
  <link rel="icon" type="image/png" href="assets/siper-icon.png">
  <link rel="apple-touch-icon" href="assets/siper-icon.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #07100d;
      --surface: #0d1814;
      --line: #233a31;
      --line-strong: #365648;
      --text: #edf7f1;
      --muted: #8fa89d;
      --accent: #b6f35c;
      --success: #68dfa5;
      --danger: #ff817a;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; color: var(--text);
      background:
        linear-gradient(rgba(182,243,92,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(182,243,92,.025) 1px,transparent 1px),
        radial-gradient(circle at 50% -20%,#163c2d 0,transparent 44%),var(--bg);
      background-size: 32px 32px,32px 32px,auto,auto;
      font-family: Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    main { width:min(720px,calc(100% - 36px)); margin:0 auto; padding:clamp(72px,12vh,126px) 0 64px; }
    header { text-align:center; }
    .brand-logo {
      display:block; width:144px; height:auto; margin:0 auto;
      filter:drop-shadow(0 0 18px rgba(182,243,92,.12));
    }
    h1 { margin:28px auto 10px; font-size:clamp(30px,6vw,46px); line-height:1.08; letter-spacing:-.045em; }
    .lead { max-width:500px; margin:0 auto; color:var(--muted); font-size:16px; line-height:1.65; }
    .scanner {
      margin-top:34px; padding:7px; border:1px solid var(--line); border-radius:16px;
      background:rgba(13,24,20,.88); box-shadow:0 24px 70px rgba(0,0,0,.28);
      backdrop-filter:blur(10px);
    }
    form { display:flex; gap:7px; }
    input {
      width:100%; min-width:0; padding:15px 16px; border:1px solid transparent;
      border-radius:11px; outline:none; color:var(--text); background:#08120f;
      font:14px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      transition:border-color .18s,box-shadow .18s;
    }
    input:focus { border-color:var(--line-strong); box-shadow:0 0 0 3px rgba(182,243,92,.08); }
    button {
      min-width:112px; padding:0 18px; border:0; border-radius:11px;
      color:#10200e; background:var(--accent); font:750 14px/1 ui-sans-serif,system-ui,sans-serif;
      cursor:pointer; transition:transform .15s,filter .15s;
    }
    button:hover { filter:brightness(1.06); transform:translateY(-1px); }
    button:disabled { cursor:wait; opacity:.6; transform:none; }
    .hint {
      margin:11px 8px 4px; color:#6f887d;
      font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; text-align:center;
    }
    .result {
      margin-top:20px; overflow:hidden; border:1px solid var(--line); border-radius:18px;
      background:rgba(13,24,20,.92); animation:enter .28s ease-out;
    }
    .summary { display:grid; grid-template-columns:86px 1fr; align-items:center; gap:22px; padding:22px; }
    .grade {
      display:grid; width:86px; height:86px; place-items:center;
      border:1px solid var(--line-strong); border-radius:50%; color:var(--accent); background:#091410;
      box-shadow:inset 0 0 24px rgba(182,243,92,.05);
      font:800 37px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
    .score { font-size:22px; font-weight:720; letter-spacing:-.025em; }
    .meta {
      display:block; max-width:100%; margin-top:6px; overflow:hidden; color:var(--muted);
      font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      text-overflow:ellipsis; white-space:nowrap;
    }
    .findings { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); border-top:1px solid var(--line); }
    .finding {
      display:flex; min-width:0; gap:10px; align-items:flex-start; padding:14px 16px;
      border-bottom:1px solid var(--line); font-size:13px;
    }
    .finding:nth-child(odd) { border-right:1px solid var(--line); }
    .finding:nth-last-child(-n + 2) { border-bottom:0; }
    .status {
      flex:0 0 auto; width:8px; height:8px; margin-top:5px; border-radius:50%;
      background:currentColor; box-shadow:0 0 12px currentColor;
    }
    .finding-title { overflow:hidden; text-overflow:ellipsis; }
    .pass { color:var(--success); }
    .fail { color:var(--danger); }
    .finding small { display:block; margin-top:4px; color:var(--muted); line-height:1.45; }
    .error {
      margin:16px 6px 4px; color:var(--danger);
      font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; text-align:center;
    }
    .hidden { display:none; }
    @keyframes enter { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @media (max-width:580px) {
      main { width:min(100% - 24px,720px); padding-top:58px; }
      h1 { margin-top:22px; }
      form { flex-direction:column; }
      button { min-height:48px; }
      .summary { grid-template-columns:70px 1fr; gap:16px; padding:18px; }
      .grade { width:70px; height:70px; font-size:30px; }
      .score { font-size:18px; }
      .findings { grid-template-columns:1fr; }
      .finding:nth-child(odd) { border-right:0; }
      .finding:nth-last-child(2) { border-bottom:1px solid var(--line); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img class="brand-logo" src="assets/siper-wordmark.png" width="600" height="200" alt="Siper">
      <h1>Web sitenin güvenliğini ölç.</h1>
      <p class="lead">Bağlantıyı yapıştır. HTTPS, TLS ve temel güvenlik ayarlarını pasif olarak kontrol edelim.</p>
    </header>
    <section class="scanner" aria-label="Web güvenlik denetimi">
      <form id="form">
        <input id="url" type="url" inputmode="url" autocomplete="url" placeholder="https://ornek.com" aria-label="Denetlenecek web sitesi" required>
        <button type="submit">Denetle</button>
      </form>
      <div class="hint">Yalnızca sahibi olduğunuz veya test izni aldığınız sistemleri denetleyin.</div>
    </section>
    <section id="result" class="result hidden" aria-live="polite">
      <div class="summary">
        <div class="grade" id="grade"></div>
        <div><div class="score" id="score"></div><span class="meta" id="meta"></span></div>
      </div>
      <div class="findings" id="findings"></div>
    </section>
    <p id="error" class="error hidden" role="alert"></p>
  </main>
  <script>
    const form=document.querySelector('#form');
    const button=form.querySelector('button');
    const result=document.querySelector('#result');
    const error=document.querySelector('#error');
    const apiBase=location.protocol==='file:'?'http://127.0.0.1:3000':'';
    form.addEventListener('submit',async(event)=>{
      event.preventDefault(); button.disabled=true; button.textContent='Ölçülüyor…';
      result.classList.add('hidden'); error.classList.add('hidden');
      try {
        const response=await fetch(`${apiBase}/api/audit`,{
          method:'POST',headers:{'content-type':'application/json'},
          body:JSON.stringify({url:document.querySelector('#url').value})
        });
        const data=await response.json();
        if(!response.ok) throw new Error(data.error);
        document.querySelector('#grade').textContent=data.grade;
        document.querySelector('#score').textContent=`${data.score}/100 güvenlik puanı`;
        document.querySelector('#meta').textContent=`${data.finalUrl} · HTTP ${data.status}${data.certificate?` · TLS ${data.certificate.daysRemaining} gün`:''}`;
        document.querySelector('#findings').innerHTML=data.findings.map((finding)=>`
          <div class="finding">
            <span class="status ${finding.passed?'pass':'fail'}" aria-hidden="true"></span>
            <div class="finding-title">${escapeHtml(finding.title)}${finding.passed?'':`<small>${escapeHtml(finding.guidance)}</small>`}</div>
          </div>`).join('');
        result.classList.remove('hidden');
      } catch(caught) {
        error.textContent=caught instanceof TypeError
          ?'Yerel Siper sunucusuna ulaşılamadı. npm start komutunu çalıştırıp sayfayı yenileyin.'
          :caught.message;
        error.classList.remove('hidden');
      } finally { button.disabled=false; button.textContent='Denetle'; }
    });
    function escapeHtml(value){const div=document.createElement('div');div.textContent=value;return div.innerHTML}
  </script>
</body>
</html>
